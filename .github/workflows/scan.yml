name: Daily scan

on:
  schedule:
    # 21:35 UTC Mon-Fri = after the US close (17:35 ET in summer, 16:35 ET in winter)
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner/scan.py
      - name: Commit results
        run: |
          git config user.name "swing-watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Scan $(date -u +%Y-%m-%d)"
          git push
